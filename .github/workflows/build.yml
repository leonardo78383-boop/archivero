name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Preparar el proyecto
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJ=." >> "$GITHUB_ENV"
          else
            Z=$(ls -1 | grep -E '^Archivero_v[0-9_]+\.zip$' | sort -V | tail -n 1)
            if [ -z "$Z" ]; then echo "No encontré el proyecto ni un ZIP Archivero_vX_Y.zip"; exit 1; fi
            echo "Usando $Z"
            unzip -q "$Z" -d _src
            D=$(dirname "$(find _src -name settings.gradle.kts | head -n 1)")
            echo "PROJ=$D" >> "$GITHUB_ENV"
          fi

      - name: Compilar release
        working-directory: ${{ env.PROJ }}
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Archivero-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/*.apk
